name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: vet, staticcheck, race tests, the README's demo, the fixture generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest && staticcheck ./...
      # On Linux the symlink test runs; on the Windows machine this was written on it skips.
      - run: go test -race -count=1 ./...
      - run: go build -o bin/certwarden ./cmd/certwarden
      - name: the README's demo must be what the binary prints
        run: ./scripts/check-readme.sh
      - name: the fixture generator must still produce files the tool reads as designed
        run: |
          # The keys are random, so the files differ from the committed ones; the verdicts must not.
          go run ./scripts/mkfixtures /tmp/fixtures
          ./bin/certwarden /tmp/fixtures/fullchain.pem --now 2026-10-10T00:00:00Z
          for f in expired missing-intermediate weak no-san; do
            if ./bin/certwarden "/tmp/fixtures/$f.pem" --now 2026-10-10T00:00:00Z; then
              echo "$f.pem should have failed" >&2; exit 1
            fi
          done
      - name: a private key in a certificate file is caught
        run: |
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=ci.example.org \
            -addext subjectAltName=DNS:ci.example.org -days 30 -keyout /tmp/k.pem -out /tmp/c.pem
          cat /tmp/c.pem /tmp/k.pem > /tmp/both.pem
          ./bin/certwarden /tmp/both.pem | tee /tmp/out.txt || true
          grep -q CW070 /tmp/out.txt
          ! grep -q -- '-----BEGIN' /tmp/out.txt

  fuzz:
    name: fuzz the parser and the audit for 60 seconds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^FuzzParseAndAudit$' -fuzztime 60s ./internal/certs

  secrets:
    name: credsweep over the full commit history
    runs-on: ubuntu-latest
    steps:
      # A shallow clone would let credsweep report a false all-clear.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go install github.com/sriharifortitude/credsweep/cmd/credsweep@v0.1.3
      - run: credsweep scan .
